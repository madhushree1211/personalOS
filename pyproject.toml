[tool.ruff]
line-length = 120
exclude = ["backend/alembic"]

[tool.ruff.lint]
select = ["E", "F"]
# Style debt in code written before this lint existed. Not reformatted on purpose:
# a mass reformat of security-critical files (capabilities, policy, seed) is risk
# with no behaviour gain. CI still enforces pyflakes (F) and the other E rules.
ignore = ["E501", "E701", "E702"]

[tool.ruff.lint.per-file-ignores]
# E402 is deliberate here: sys.path must be adjusted before `app` can be imported,
# or (main.py) the security router is included after `app` exists.
"scripts/*.py" = ["E402"]
"backend/tests/test_routing_eval.py" = ["E402"]
"backend/app/main.py" = ["E402"]